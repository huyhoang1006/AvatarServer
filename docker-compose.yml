services:
  postgres:
    image: postgres:16-alpine
    container_name: avatar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: avatar
      POSTGRES_PASSWORD: avatar_pass
      POSTGRES_DB: avatar_farm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avatar -d avatar_farm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: avatar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Chạy migration rồi thoát. app đợi service này xong mới khởi động, nên schema
  # luôn sẵn sàng trước khi server lên — không cần synchronize.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avatar-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: avatar
      DB_PASSWORD: avatar_pass
      DB_NAME: avatar_farm
    command: ["npm", "run", "db:migrate:prod"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avatar-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: avatar
      DB_PASSWORD: avatar_pass
      DB_NAME: avatar_farm
      DB_SYNCHRONIZE: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 7d
    # KHÔNG mount ./dist đè lên /app/dist: dist trên host là bản build cho môi trường
    # dev, đè vào sẽ che mất bản build trong image và container chết ngay khi start.

volumes:
  postgres_data:
  redis_data:
